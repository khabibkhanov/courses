      - { n: 12, slug: slice-tuzoqlari, title: "Slice tuzoqlari: aliasing, to'liq slice ifodasi, xotirani ushlab turish", sources: [blog-slices-intro, 100go, pkg-slices] }
      - { n: 13, slug: string-rune-utf8, title: "string, byte, rune va UTF-8", sources: [go-spec, gopl, 100go] }
      - { n: 14, slug: map-ichi, title: "Map: semantika, iteratsiya tartibi va Swiss table", sources: [blog-maps, blog-swisstable, go-spec] }
      - { n: 15, slug: map-amaliyot, title: "Map amaliyotda: kalit tanlash, set, maps paketi", sources: [pkg-maps, blog-maps, 100go] }
      - { n: 16, slug: struct-layout, title: "Struct xotira joylashuvi: alignment, padding va maydonlar tartibi", sources: [go-spec, pkg-unsafe, 100go] }
      - { n: 17, slug: interface-ichi, title: "Interface qanday ishlaydi: dinamik tip va qiymat", sources: [go-spec, gopl, 100go] }
      - { n: 18, slug: nil-turlari, title: "nil: pointer, interface, slice, map, channel va klassik tuzoq", sources: [go-spec, go-faq, 100go] }
