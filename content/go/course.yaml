slug: go
title: Go (advanced)
subtitle: Go tili, runtime va production servislar - 100 darslik to'liq kurs
description: >-
  Go'ni spetsifikatsiya darajasidan production'gacha o'rgatuvchi chuqur kurs: til semantikasi,
  slice/map/interface ichki tuzilishi, generics va iterator'lar, concurrency va xotira modeli,
  scheduler va garbage collector, profiling, net/http va gRPC, PostgreSQL va Redis bilan ishlash,
  observability, xavfsizlik va servis arxitekturasi. Asosiy manbalar: rasmiy spetsifikatsiya,
  Go xotira modeli, runtime hujjatlari, Go Blog va release notes (Go 1.27 gacha).
audience: "Backend tajribasi bor dasturchilar uchun (masalan, Node.js/TypeScript'dan Go'ga o'tayotganlar yoki Go'ni sirtdan biladiganlar). Go sintaksisini o'qiy olish kifoya; til asoslari ham spetsifikatsiya darajasida, tuzoqlari bilan qayta ko'riladi. Misollar real servislar atrofida: telemetriya, buyurtmalar, to'lovlar."
order: 4
color: "#00a7c7"
format: clean-code
passScore: 1
library:
  - { title: "The Go Programming Language Specification", by: "Go team", href: "https://go.dev/ref/spec" }
  - { title: "The Go Memory Model", by: "Go team", href: "https://go.dev/ref/mem" }
  - { title: "A Guide to the Go Garbage Collector", by: "Go team", href: "https://go.dev/doc/gc-guide" }
  - { title: "100 Go Mistakes and How to Avoid Them", by: "Teiva Harsanyi", href: "https://100go.co/" }
  - { title: "The Go Programming Language", by: "Donovan, Kernighan", href: "https://www.gopl.io/" }
modules:
  - n: 1
    title: Til semantikasi
    goal: "Spetsifikatsiya darajasida: tiplar, assignability, defer, pointer, method set, package va init tartibi"
    lessons:
      - { n: 1, slug: go-falsafa-va-versiyalar, title: "Go falsafasi, versiyalar va Go 1 compatibility", sources: [go1compat, go-releases, go-faq, godebug-doc] }
      - { n: 2, slug: toolchain-va-go-mod, title: "Toolchain: go command, GOTOOLCHAIN va go.mod'dagi go/toolchain qatorlari", sources: [toolchain-doc, gomod-ref, go-mod-ref] }
      - { n: 3, slug: tiplar-konstantalar-iota, title: "Tiplar, o'zgaruvchilar, untyped constant va iota", sources: [go-spec, gopl] }
      - { n: 4, slug: assignability-va-konversiya, title: "Type identity, assignability va konversiyalar", sources: [go-spec, gopl] }
      - { n: 5, slug: boshqaruv-oqimi, title: "for, switch, label va loop o'zgaruvchisi semantikasi", sources: [go-spec, gopl, 100go] }
      - { n: 6, slug: funksiyalar-closure, title: "Funksiyalar, closure, method value va variadic", sources: [go-spec, gopl, 100go] }
      - { n: 7, slug: defer-semantikasi, title: "defer: baholash tartibi, xarajat va tuzoqlar", sources: [go-spec, blog-defer-panic, 100go] }
      - { n: 8, slug: zero-value-struct, title: "Zero value, struct, composite literal va struct tag", sources: [go-spec, gopl, code-review-comments] }
      - { n: 9, slug: pointer-va-receiver, title: "Pointer, addressability, method set va receiver tanlash", sources: [go-spec, code-review-comments, 100go] }
      - { n: 10, slug: package-va-init, title: "Package, ko'rinish, init tartibi va blank identifier", sources: [go-spec, gopl, code-review-comments] }
  - n: 2
    title: Ma'lumotlar tuzilmalari ichi
    goal: "Slice, string, map, struct va interface xotirada qanday turishi; stack/heap va escape analysis"
