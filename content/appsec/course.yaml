slug: appsec
title: Application Security
subtitle: Ilova xavfsizligi - 100 darslik to'liq kurs
description: >-
  Backend va fullstack dasturchi uchun Application Security kursi: threat modeling, web platforma xavfsizlik modeli,
  injection, client-side hujumlar, authentication va authorization, amaliy kriptografiya, API va backend xavfsizligi,
  supply chain va DevSecOps, shuningdek case study'lar va capstone. Har mavzu mexanizm darajasida beriladi: zaif kod,
  hujum va tuzatilgan kod. Asosiy manbalar: OWASP Top 10 2025, ASVS 5.0.0, OWASP API Security Top 10 (2023), WSTG,
  Cheat Sheet Series, CWE Top 25 (2025), NIST va IETF/W3C spetsifikatsiyalari.
audience: "Backend yoki fullstack tajribasi bor dasturchilar uchun (Node.js/TypeScript, PostgreSQL, Redis). Dasturlash asoslari tushuntirilmaydi. Misollar Node.js, NestJS, Fastify, Next.js, Prisma va Kysely stack'ida, neytral avtopark monitoring platformasi atrofida; hujum namunalari faqat darsning o'z o'quv kodiga qarshi. Hujumlar ta'lim uchun o'quv kodida ko'rsatiladi; ularni boshqalarning tizimlarida yozma ruxsatsiz qo'llash O'zbekiston qonunchiligiga ko'ra huquqbuzarlik (batafsil 9-darsda)."
order: 5
color: "#7c3aed"
format: clean-code
passScore: 1
library:
  - { title: "OWASP Top 10:2025", by: "OWASP Foundation", href: "https://top10.owasp.org/2025/" }
  - { title: "OWASP Application Security Verification Standard 5.0.0", by: "OWASP Foundation", href: "https://github.com/OWASP/ASVS/tree/v5.0.0" }
  - { title: "OWASP Web Security Testing Guide", by: "OWASP Foundation", href: "https://owasp.org/www-project-web-security-testing-guide/" }
  - { title: "OWASP Cheat Sheet Series", by: "OWASP Foundation", href: "https://cheatsheetseries.owasp.org/" }
  - { title: "2025 CWE Top 25 Most Dangerous Software Weaknesses", by: "MITRE", href: "https://cwe.mitre.org/top25/archive/2025/2025_cwe_top25.html" }
modules:
  - n: 1
    title: "Asoslar va threat modeling"
    goal: "Xavfsizlik tushunchalari (CIA, tahdid, zaiflik, risk), hujumchi modeli, secure design tamoyillari, threat modeling, standartlar xaritasi (OWASP Top 10 2025, CWE/CVSS, ASVS), huquqiy chegaralar va kurs laboratoriyasi"
    lessons:
      - { n: 1, slug: xavfsizlik-asoslari, title: "Xavfsizlik nima: CIA, tahdid, zaiflik va risk", sources: [fips199, nist-30, t10-risks, cwe-about] }
      - { n: 2, slug: hujumchi-modeli, title: "Hujumchi modeli va attack surface", sources: [t10-risks, cs-threat-model, wstg] }
      - { n: 3, slug: secure-design-tamoyillari, title: "Secure design tamoyillari: least privilege, defense in depth, fail-safe defaults", sources: [saltzer, t10-a06, nist-ssdf] }
      - { n: 4, slug: threat-modeling-stride, title: "Threat modeling: data flow diagram, trust boundary va STRIDE", sources: [ms-stride, cs-threat-model, t10-a06] }
      - { n: 5, slug: threat-modeling-amaliyot, title: "Threat modeling amaliyotda: avtopark platformasi modeli", sources: [cs-threat-model, ms-stride, asvs] }
      - { n: 6, slug: owasp-top10-2025, title: "OWASP Top 10 2025: xarita va undan qanday foydalanish", sources: [t10-risks, t10-a01, t10-a05, t10-a10] }
      - { n: 7, slug: cwe-cve-cvss-epss-kev, title: "CWE, CVE, CVSS, EPSS va KEV", sources: [cwe-top25, cwe-about, cvss4, epss] }
      - { n: 8, slug: asvs-5, title: "ASVS 5.0: xavfsizlik talablarini yozish va tekshirish", sources: [asvs, wstg, samm] }
      - { n: 9, slug: huquqiy-va-etik-chegaralar, title: "Huquqiy va etik chegaralar: O'zbekiston qonunchiligi va responsible disclosure", sources: [lex-cyber, lex-pdp, wstg] }
      - { n: 10, slug: xavfsiz-laboratoriya, title: "Xavfsiz laboratoriya muhiti va kurs bo'ylab ishlatiladigan zaif ilova", sources: [juice-shop, wstg, node-security] }
