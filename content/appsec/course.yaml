      - { n: 13, slug: cookie-xavfsizligi, title: "Cookie: Secure, HttpOnly, SameSite va prefikslar", sources: [rfc6265, rfc6265bis, mdn-cookies, cs-session] }
      - { n: 14, slug: cors, title: "CORS: preflight, credentials va xato sozlamalar", sources: [mdn-cors, whatwg-fetch, t10-a02] }
      - { n: 15, slug: csp-direktivalar, title: "Content Security Policy: direktivalar, nonce va strict-dynamic", sources: [csp3, mdn-csp, cs-csp] }
      - { n: 16, slug: security-headerlar, title: "Security header'lar: HSTS, X-Content-Type-Options, Referrer-Policy, Permissions-Policy", sources: [rfc6797, nestjs-helmet, t10-a02] }
      - { n: 17, slug: fetch-metadata-izolyatsiya, title: "Fetch Metadata va cross-origin izolyatsiya (COOP, COEP, CORP)", sources: [fetch-metadata, whatwg-html, whatwg-fetch] }
      - { n: 18, slug: https-amaliyotda, title: "HTTPS amaliyotda: TLS sozlamalari, sertifikat va mixed content", sources: [rfc8446, rfc6797, rfc5280, t10-a04] }
      - { n: 19, slug: brauzer-storage, title: "Brauzer storage: token qayerda saqlanadi", sources: [cs-session, mdn-cookies, t10-a07] }
      - { n: 20, slug: smuggling-cache-proxy, title: "Request smuggling, cache poisoning va proxy zanjiri", sources: [rfc9112, rfc9110, t10-a02] }
